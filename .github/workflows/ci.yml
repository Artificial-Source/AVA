name: CI

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      run_acpx:
        description: Run the opt-in alpha acpx interoperability smoke
        required: false
        type: boolean
        default: false
      release_candidate:
        description: Build, qualify and retain the exact Linux x64 release candidate
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Debug
          - Release
    env:
      CC: gcc-16
      CXX: g++-16
      GITACHE_ROOT: /tmp/ava-gitache-${{ matrix.build_type }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Benchmark provenance tests inspect pinned ancestor commits.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 cmake ninja-build libncursesw5-dev pkg-config libboost-dev libdw-dev universal-ctags tmux ccache

      - name: Restore gitache cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GITACHE_ROOT }}
          key: gitache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            gitache-${{ runner.os }}-${{ runner.arch }}-${{ matrix.build_type }}-

      - name: Set up compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          key-prefix: ccache-${{ runner.os }}-${{ runner.arch }}-gcc16-${{ matrix.build_type }}
          save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Configure
        run: |
          mkdir -p "$GITACHE_ROOT"
          cmake -S . -B build -G Ninja -DAVA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Guard against C++ module scanner flags
        run: scripts/guard-no-cxx-modules.sh build

      - name: Build
        run: |
          ccache -z
          scripts/build.sh --build-dir build

      - name: Compiler cache metrics
        if: always()
        run: ccache -s

      - name: Test
        run: scripts/run-tests.sh --build-dir build --output-junit "${{ runner.temp }}/ava-junit-${{ matrix.build_type }}.xml"

      - name: Summarize test results
        if: always()
        run: |
          python3 scripts/summarize-test-results.py "${{ runner.temp }}/ava-junit-${{ matrix.build_type }}.xml" \
            --require ava_tests.containment --require ava_tests.tools --require ava_tests.session \
            --require ava_tests.process_monitor --require ava_tests.process_adoption_posix \
            --require ava_tests.process_capability_posix --require ava_tests.process_deadline \
            --require ava_tests.process_launch_protocol_posix --require ava_tests.process_readiness \
            --require ava_tests.process_supervisor_posix --require ava_release.provenance

      - name: Run required real-terminal checks
        if: matrix.build_type == 'Release'
        env:
          AVA_TUI_TMUX_SMOKE: "1"
          AVA_TUI_TERMINAL_LIFECYCLE_SMOKE: "1"
        run: |
          scripts/run-tests.sh --build-dir build --jobs 2 --no-tests=error \
            --output-junit "${{ runner.temp }}/ava-junit-terminal.xml" \
            -R '^(ava_tui[.]terminal_lifecycle_smoke|ava_tui[.]tmux_smoke_(main_editor_input|main_permission_flow|active_run))$'

      - name: Verify required terminal results
        if: always() && matrix.build_type == 'Release'
        run: |
          python3 scripts/summarize-test-results.py "${{ runner.temp }}/ava-junit-terminal.xml" \
            --require-count 4 --require-no-skips \
            --require ava_tui.terminal_lifecycle_smoke \
            --require ava_tui.tmux_smoke_main_editor_input \
            --require ava_tui.tmux_smoke_main_permission_flow \
            --require ava_tui.tmux_smoke_active_run

  release-candidate:
    name: Qualify retained Linux x64 candidate
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate || startsWith(github.ref, 'refs/tags/v')
    needs: [sanitizer, tsan]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-13
      CXX: g++-13
      GITACHE_ROOT: /tmp/ava-gitache-candidate
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      manifest_sha256: ${{ steps.identity.outputs.manifest_sha256 }}
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install minimum-host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake ninja-build libncursesw5-dev pkg-config libboost-dev binutils tmux curl
      - name: Configure final Release build
        run: cmake --preset release-candidate -G Ninja -DCMAKE_CXX_SCAN_FOR_MODULES=OFF -DAVA_TUI_TEST_BASE="${{ runner.temp }}"
      - name: Build final bytes once
        run: scripts/build.sh --build-dir build-candidate --jobs 6
      - name: Seal executable identities before tests
        run: |
          mkdir -p "${{ runner.temp }}/candidate-evidence"
          python3 scripts/release-candidate.py seal --build-dir build-candidate
          cp build-candidate/release-build.json "${{ runner.temp }}/candidate-evidence/"
      - name: Full deterministic CTest on final build
        run: |
          scripts/run-tests.sh --build-dir build-candidate --jobs 6 \
            --output-junit "${{ runner.temp }}/candidate-evidence/deterministic.xml"
          python3 scripts/summarize-test-results.py "${{ runner.temp }}/candidate-evidence/deterministic.xml" \
            --require ava_release.provenance --require ava_release.install_component \
            --require ava_release.package_linux --require ava_release.candidate_contract \
            --require ava_release.artifact_inspection
      - name: All 23 tmux gates on final build
        env:
          AVA_TUI_TMUX_SMOKE: "1"
        run: |
          scripts/run-tests.sh --build-dir build-candidate --jobs 6 --no-tests=error \
            --output-junit "${{ runner.temp }}/candidate-evidence/tmux.xml" -R '^ava_tui\.tmux_smoke_'
          python3 scripts/summarize-test-results.py "${{ runner.temp }}/candidate-evidence/tmux.xml" \
            --require-count 23 --require-no-skips
      - name: All four direct PTY gates on final build
        env:
          AVA_TUI_TERMINAL_LIFECYCLE_SMOKE: "1"
          AVA_TUI_KITTY_IMAGE_SMOKE: "1"
          AVA_TUI_ITERM2_IMAGE_SMOKE: "1"
          AVA_TUI_OSC8_SMOKE: "1"
        run: |
          scripts/run-tests.sh --build-dir build-candidate --jobs 4 --no-tests=error \
            --output-junit "${{ runner.temp }}/candidate-evidence/pty.xml" \
            -R '^ava_tui\.(terminal_lifecycle_smoke|kitty_image_smoke|iterm2_image_smoke|osc8_smoke)$'
          python3 scripts/summarize-test-results.py "${{ runner.temp }}/candidate-evidence/pty.xml" \
            --require-count 4 --require-no-skips
      - name: Package tested bytes without rebuilding
        run: |
          mkdir -m 0700 "${{ runner.temp }}/candidate"
          scripts/package-linux.sh --build-dir "$PWD/build-candidate" --require-release-qualified \
            --output-dir "${{ runner.temp }}/candidate"
          python3 scripts/release-candidate.py record --build-dir build-candidate --directory "${{ runner.temp }}/candidate"
          python3 scripts/inspect-linux-artifact.py "${{ runner.temp }}"/candidate/*.tar.gz \
            --output "${{ runner.temp }}/candidate-evidence/inspection.json"
      - name: Minimum host and CPU smoke on extracted archive
        run: |
          scripts/smoke-linux-minimum-host.sh "${{ runner.temp }}/candidate" "$PWD/build-candidate/tests/ava_fake_provider_server" \
            2>&1 | tee "${{ runner.temp }}/candidate-evidence/minimum-host.log"
      - name: Record promotable digests and same-commit evidence
        id: identity
        run: |
          manifest_sha256=$(sha256sum "${{ runner.temp }}/candidate/candidate.json" | cut -d ' ' -f 1)
          revision=$(git rev-parse HEAD)
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          {
            echo "## Retained Linux x64 candidate"
            echo "Commit: $revision; run: $GITHUB_RUN_ID; sanitizer: ${{ needs.sanitizer.result }}; focused TSan: ${{ needs.tsan.result }}"
            echo "Both sanitizer jobs checked out this same workflow commit; neither produces release bytes."
            echo "Retention: 90 days; candidate.json SHA-256: $manifest_sha256"
            cat "${{ runner.temp }}/candidate/candidate.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain unchanged candidate archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain candidate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-evidence/
            build-candidate/Testing/Temporary/
            ${{ runner.temp }}/tui-tmux-smoke/*/evidence/
          if-no-files-found: error
          retention-days: 90

  verify-promotion:
    name: Re-download and verify retained bytes (no publication)
    needs: release-candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Re-download retained candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-x64-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promoted
      - name: Re-verify independent recorded digests without building
        env:
          MANIFEST_SHA256: ${{ needs.release-candidate.outputs.manifest_sha256 }}
          REVISION: ${{ needs.release-candidate.outputs.revision }}
        run: |
          python3 scripts/release-candidate.py verify --directory "${{ runner.temp }}/promoted" \
            --manifest-sha256 "$MANIFEST_SHA256" --revision "$REVISION"
          python3 scripts/inspect-linux-artifact.py "${{ runner.temp }}"/promoted/*.tar.gz
          tar -xzf "${{ runner.temp }}"/promoted/*.tar.gz -C "${{ runner.temp }}/promoted"
          "${{ runner.temp }}"/promoted/ava-*/bin/ava --version
          "${{ runner.temp }}"/promoted/ava-*/bin/ava --help
          {
            echo "## Promotion verification (no build, tag or publication)"
            echo "Commit: $REVISION; manifest SHA-256 before and after: $MANIFEST_SHA256"
            cat "${{ runner.temp }}/promoted/candidate.json"
          } >> "$GITHUB_STEP_SUMMARY"

  arm64-release:
    name: Build and test (AArch64 Release)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CC: gcc-13
      CXX: g++-13
      GITACHE_ROOT: /tmp/ava-gitache-arm64-release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Benchmark provenance tests inspect pinned ancestor commits.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake ninja-build libncursesw5-dev pkg-config libboost-dev libdw-dev universal-ctags ccache

      - name: Set up compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          key-prefix: ccache-${{ runner.os }}-${{ runner.arch }}-gcc13-Release
          save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Configure
        run: |
          mkdir -p "$GITACHE_ROOT"
          cmake -S . -B build -G Ninja -DAVA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Guard against C++ module scanner flags
        run: scripts/guard-no-cxx-modules.sh build

      - name: Build
        run: |
          ccache -z
          scripts/build.sh --build-dir build

      - name: Compiler cache metrics
        if: always()
        run: ccache -s

      - name: Test
        run: scripts/run-tests.sh --build-dir build --output-junit "${{ runner.temp }}/ava-junit-arm64-release.xml"

      - name: Summarize test results
        if: always()
        run: |
          python3 scripts/summarize-test-results.py "${{ runner.temp }}/ava-junit-arm64-release.xml" \
            --require ava_tests.containment --require ava_tests.tools --require ava_tests.session \
            --require ava_tests.process_monitor --require ava_tests.process_adoption_posix \
            --require ava_tests.process_capability_posix --require ava_tests.process_deadline \
            --require ava_tests.process_launch_protocol_posix --require ava_tests.process_readiness \
            --require ava_tests.process_supervisor_posix --require ava_release.provenance

      - name: Build strict release package
        run: |
          output_dir=$(mktemp -d "${{ runner.temp }}/ava-release-output.XXXXXXXX")
          chmod 0700 "$output_dir"
          trap 'rm -rf "$output_dir"' EXIT
          status=$(git status --porcelain --untracked-files=all)
          if [[ -n $status ]]; then
            printf 'error: source checkout is not clean before strict packaging:\n%s\n' "$status" >&2
            exit 1
          fi
          # Strict packaging stays uncached: the fresh private configure
          # keeps its default module scanning and qualification inputs.
          CCACHE_DISABLE=1 scripts/package-linux.sh --require-release-qualified --output-dir "$output_dir"

  tsan:
    name: ThreadSanitizer coordinator and ACP peer
    runs-on: ubuntu-24.04
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 cmake ninja-build libncursesw5-dev pkg-config libboost-dev libdw-dev ccache

      - name: Set up compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          key-prefix: ccache-${{ runner.os }}-${{ runner.arch }}-gcc16-TSan
          save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Configure
        run: cmake --preset tsan -G Ninja -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Guard against C++ module scanner flags
        run: scripts/guard-no-cxx-modules.sh build-tsan

      - name: Build focused test target
        run: |
          ccache -z
          scripts/build.sh --build-dir build-tsan --jobs 2 --target ava_tests

      - name: Compiler cache metrics
        if: always()
        run: ccache -s

      - name: Test focused coordinator and ACP peer races
        run: ctest --preset tsan --output-junit "${{ runner.temp }}/ava-junit-tsan.xml"

      - name: Summarize test results
        if: always()
        run: python3 scripts/summarize-test-results.py "${{ runner.temp }}/ava-junit-tsan.xml"

  sanitizer:
    name: Sanitizers
    runs-on: ubuntu-24.04
    env:
      CC: gcc-16
      CXX: g++-16
      GITACHE_ROOT: /tmp/ava-gitache-sanitizer
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Benchmark provenance tests inspect pinned ancestor commits.
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 cmake ninja-build libncursesw5-dev pkg-config libboost-dev libdw-dev universal-ctags ccache

      - name: Set up compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          key-prefix: ccache-${{ runner.os }}-${{ runner.arch }}-gcc16-ASanUBSan
          save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Configure
        run: |
          mkdir -p "$GITACHE_ROOT"
          cmake --preset sanitize -G Ninja -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Guard against C++ module scanner flags
        run: scripts/guard-no-cxx-modules.sh build-sanitize

      - name: Build
        run: |
          ccache -z
          scripts/build.sh --build-dir build-sanitize --jobs 2

      - name: Compiler cache metrics
        if: always()
        run: ccache -s

      - name: Test
        id: sanitizer-test
        run: scripts/run-tests.sh --build-dir build-sanitize --jobs 2 --output-junit "${{ runner.temp }}/ava-junit-sanitize.xml"

      - name: Summarize test results
        if: always() && steps.sanitizer-test.outcome != 'skipped'
        run: |
          python3 scripts/summarize-test-results.py "${{ runner.temp }}/ava-junit-sanitize.xml" \
            --require ava_tests.containment --require ava_tests.tools --require ava_tests.session \
            --require ava_tests.process_monitor --require ava_tests.process_adoption_posix \
            --require ava_tests.process_capability_posix --require ava_tests.process_deadline \
            --require ava_tests.process_launch_protocol_posix --require ava_tests.process_readiness \
            --require ava_tests.process_supervisor_posix --require ava_release.provenance

  acp-sdk-interop:
    name: Official ACP SDK interoperability (Release)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 cmake ninja-build libncursesw5-dev pkg-config libboost-dev libdw-dev ccache

      - name: Set up compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          key-prefix: ccache-${{ runner.os }}-${{ runner.arch }}-gcc16-Release-SDK
          save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Install locked official SDK test dependencies
        working-directory: tests/acp-sdk
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Configure required SDK interoperability
        run: cmake -S . -B build-sdk -G Ninja -DAVA_BUILD_TESTS=ON -DAVA_REQUIRE_ACP_SDK_INTEROP=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Guard against C++ module scanner flags
        run: scripts/guard-no-cxx-modules.sh build-sdk

      - name: Build AVA and test helpers
        run: |
          ccache -z
          scripts/build.sh --build-dir build-sdk --target ava ava_tests ava_fake_provider_server ava_fake_mcp_server

      - name: Compiler cache metrics
        if: always()
        run: ccache -s

      - name: Run focused credential-free ACP tests
        run: |
          parent="$(mktemp -d /tmp/ava-sdk-parent.XXXXXX)"
          trap 'rm -rf "$parent"' EXIT
          install -d -m 700 "$parent"/{home,config,data,state,cache,tmp}
          /usr/bin/env -i \
            HOME="$parent/home" \
            XDG_CONFIG_HOME="$parent/config" \
            XDG_DATA_HOME="$parent/data" \
            XDG_STATE_HOME="$parent/state" \
            XDG_CACHE_HOME="$parent/cache" \
            TMPDIR="$parent/tmp" \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            ctest --test-dir build-sdk --output-on-failure \
              --output-junit "${{ runner.temp }}/ava-junit-sdk.xml" \
              -R '^(ava_cli[.]acp_sdk_interop|ava_cli[.]acp_subprocess|ava_tests[.]acp|ava_tests[.]acp_support_manifest|ava_tests[.]acp_interop_manifest)$'

      - name: Summarize test results
        if: always()
        run: python3 scripts/summarize-test-results.py "${{ runner.temp }}/ava-junit-sdk.xml"

  acpx-interop:
    name: Opt-in acpx interoperability (Release)
    if: github.event_name == 'workflow_dispatch' && inputs.run_acpx
    runs-on: ubuntu-24.04
    env:
      CC: gcc-16
      CXX: g++-16
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16 cmake ninja-build libncursesw5-dev pkg-config libboost-dev libdw-dev ccache

      - name: Set up compiler cache
        uses: ./.github/actions/setup-ccache
        with:
          key-prefix: ccache-${{ runner.os }}-${{ runner.arch }}-gcc16-Release-acpx
          save: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

      - name: Install locked acpx test dependencies
        working-directory: tests/acp-acpx
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Configure opt-in acpx interoperability
        run: cmake -S . -B build-acpx -G Ninja -DAVA_BUILD_TESTS=ON -DAVA_ENABLE_ACPX_INTEROP=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      - name: Guard against C++ module scanner flags
        run: scripts/guard-no-cxx-modules.sh build-acpx

      - name: Build AVA and fake provider
        run: |
          ccache -z
          scripts/build.sh --build-dir build-acpx --target ava ava_fake_provider_server

      - name: Compiler cache metrics
        if: always()
        run: ccache -s

      - name: Run opt-in credential-free acpx and manifest tests
        run: |
          mkdir -p "${{ runner.temp }}/ava-acpx-parent"/{home,config,data,state,cache,tmp}
          env -i \
            HOME="${{ runner.temp }}/ava-acpx-parent/home" \
            XDG_CONFIG_HOME="${{ runner.temp }}/ava-acpx-parent/config" \
            XDG_DATA_HOME="${{ runner.temp }}/ava-acpx-parent/data" \
            XDG_STATE_HOME="${{ runner.temp }}/ava-acpx-parent/state" \
            XDG_CACHE_HOME="${{ runner.temp }}/ava-acpx-parent/cache" \
            TMPDIR="${{ runner.temp }}/ava-acpx-parent/tmp" \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            ctest --test-dir build-acpx --output-on-failure \
              --output-junit "${{ runner.temp }}/ava-junit-acpx.xml" \
              -R '^(ava_cli[.]acpx_interop|ava_tests[.]acp_interop_manifest)$'

      - name: Summarize test results
        if: always()
        run: python3 scripts/summarize-test-results.py "${{ runner.temp }}/ava-junit-acpx.xml"
